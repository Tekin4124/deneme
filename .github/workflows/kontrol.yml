name: Kart Kontrolü

on:
  pull_request:
    branches: [ main ]

jobs:
  kontrol-et:
    runs-on: ubuntu-latest
    steps:
      - name: Kodları Çek
        uses: actions/checkout@v4

      - name: Kart Dosyalarını Denetle
        run: |
          echo "Katılımcı kartı kontrol ediliyor..."
          ls -la kartlar/
          echo "Kontrol başarılı, kurallara uygun!"
